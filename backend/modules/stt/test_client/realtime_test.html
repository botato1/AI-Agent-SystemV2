<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>실시간 STT 테스트</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  h3 { margin-top: 28px; }
  #status { font-weight: bold; margin-bottom: 12px; }
  #status.connected { color: #16a34a; }
  #status.disconnected { color: #dc2626; }
  button { padding: 8px 16px; font-size: 14px; margin-right: 8px; cursor: pointer; }
  #transcript { border: 1px solid #ccc; border-radius: 8px; padding: 16px; min-height: 200px; line-height: 1.8; white-space: pre-wrap; }
  .final { color: #111; }
  .final.low-conf { color: #b45309; text-decoration: underline wavy; }
  .tentative { color: #999; font-style: italic; }
  .speaker-tag { font-size: 11px; color: #2563eb; font-weight: bold; margin-right: 4px; }
  #log { margin-top: 16px; font-size: 12px; color: #666; max-height: 150px; overflow-y: auto; }
  input { padding: 6px; font-size: 13px; }
  #wsUrl, #serverUrl { width: 320px; }
  #enrollRows { margin: 10px 0; }
  .enroll-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .enroll-row input[type="text"] { width: 140px; }
  .enroll-status { font-size: 12px; color: #666; min-width: 160px; }
  .enroll-status.done { color: #16a34a; }
  .enroll-fallback { display: none; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: #b45309; }
  .enroll-fallback input[type="text"] { width: 120px; }
  .rename-toggle-btn { font-size: 11px; padding: 4px 8px; }
  .rename-box { align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; }
  .rename-box input[type="text"] { width: 120px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  legend { font-weight: bold; font-size: 13px; padding: 0 4px; }
</style>
</head>
<body>
  <h1>🎙️ 실시간 STT 파이프라인 테스트</h1>

  <fieldset>
    <legend>연결 설정</legend>
    <div><label>서버 주소 (http/https): </label><input id="serverUrl" value="http://localhost:8001" /></div>
    <div style="margin-top:6px;"><label>세션 ID: </label><input id="sessionId" value="test-session-1" /></div>
  </fieldset>

  <fieldset>
    <legend>① 화자 사전 등록 (선택 사항 — 회의 시작 전, 인원수를 미리 알 때)</legend>
    <div>
      <label>참석 인원수: </label>
      <input id="speakerCount" type="number" min="1" max="10" value="2" style="width:60px;" />
      <button id="buildEnrollRowsBtn">인원 입력칸 만들기</button>
      <button id="clearEnrollBtn">등록 초기화</button>
    </div>
    <div id="enrollRows"></div>
    <div style="font-size:12px;color:#888;">
      각자 버튼 누르고 <b>"안녕하세요 OOO입니다"</b>라고 말하면, 이름이 자동으로 인식되어 등록됨
      (말이 끝나면 자동으로 녹음 종료). 이름 인식이 실패하면 직접 입력할 수 있는 칸이 나타남.
      등록 안 하고 바로 시작하면 자동감지(열린 집합) 모드로 동작.
    </div>
  </fieldset>

  <div id="status" class="disconnected">연결 안 됨</div>
  <button id="startBtn">🔴 ② 시작 (마이크 켜기)</button>
  <button id="stopBtn" disabled>⏹️ 종료</button>

  <h3>실시간 전사 결과</h3>
  <div id="transcript"></div>

  <h3>이벤트 로그</h3>
  <div id="log"></div>

<script>
const REALTIME_SAMPLE_RATE = 16000; // 백엔드 config.REALTIME_SAMPLE_RATE 와 반드시 일치해야 함
const ENROLL_DURATION_SEC = 5;

let audioContext, mediaStream, sourceNode, processorNode, ws;
let tentativeSpan = null;

const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const logEl = document.getElementById("log");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const serverUrlInput = document.getElementById("serverUrl");
const sessionIdInput = document.getElementById("sessionId");
const speakerCountInput = document.getElementById("speakerCount");
const enrollRowsEl = document.getElementById("enrollRows");

function log(msg) {
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.prepend(line);
}

function setStatus(connected) {
  statusEl.textContent = connected ? "연결됨" : "연결 안 됨";
  statusEl.className = connected ? "connected" : "disconnected";
}

function httpBase() {
  return serverUrlInput.value.replace(/\/$/, "");
}

function wsUrl() {
  return httpBase().replace(/^http/, "ws") + `/api/ws/stt/${encodeURIComponent(sessionIdInput.value)}`;
}

// 브라우저 오디오(보통 44.1k/48kHz Float32) → 서버가 기대하는 16kHz PCM16LE로 변환
function downsampleTo16k(float32Array, inputSampleRate) {
  if (inputSampleRate === REALTIME_SAMPLE_RATE) return float32Array;
  const ratio = inputSampleRate / REALTIME_SAMPLE_RATE;
  const outLength = Math.floor(float32Array.length / ratio);
  const result = new Float32Array(outLength);
  for (let i = 0; i < outLength; i++) {
    result[i] = float32Array[Math.floor(i * ratio)];
  }
  return result;
}

function float32ToPCM16LE(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); // little-endian
  }
  return buffer;
}

// ── ① 화자 사전 등록 (말하면 자동으로 이름 인식) ──────────────
const ENROLL_MAX_SEC = 8;          // 이 이상 말해도 강제 종료
const ENROLL_SILENCE_MS = 800;     // 말 시작 후 이만큼 조용하면 자동 종료
const ENROLL_SPEECH_RMS = 0.02;    // 이 이상 소리 크기여야 "말하는 중"으로 판단

document.getElementById("buildEnrollRowsBtn").onclick = () => {
  const n = parseInt(speakerCountInput.value, 10) || 1;
  enrollRowsEl.innerHTML = "";
  for (let i = 1; i <= n; i++) {
    const row = document.createElement("div");
    row.className = "enroll-row";
    row.style.flexDirection = "column";
    row.style.alignItems = "flex-start";
    row.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" class="record-btn">🎙️ ${i}번째 분 — "안녕하세요 OOO입니다" 녹음</button>
        <span class="enroll-status">미등록</span>
        <button type="button" class="rename-toggle-btn" style="display:none;">✏️ 이름 수정</button>
      </div>
      <div class="enroll-fallback">
        이름 인식 실패 (인식된 말: <span class="detected-text"></span>)
        <input type="text" placeholder="이름 직접 입력" />
        <button type="button" class="manual-confirm-btn">이 이름으로 등록</button>
      </div>
      <div class="rename-box" style="display:none;">
        <input type="text" placeholder="올바른 이름 입력" />
        <button type="button" class="rename-confirm-btn">수정 완료</button>
      </div>
    `;
    const recordBtn = row.querySelector(".record-btn");
    const statusSpan = row.querySelector(".enroll-status");
    const fallbackDiv = row.querySelector(".enroll-fallback");
    const detectedTextSpan = row.querySelector(".detected-text");
    const manualInput = row.querySelector('.enroll-fallback input[type="text"]');
    const manualConfirmBtn = row.querySelector(".manual-confirm-btn");
    const renameToggleBtn = row.querySelector(".rename-toggle-btn");
    const renameBox = row.querySelector(".rename-box");
    const renameInput = row.querySelector('.rename-box input[type="text"]');
    const renameConfirmBtn = row.querySelector(".rename-confirm-btn");
    const lastPcm16 = { value: null };  // 이름 인식 실패 시, 수동 재시도에서 같은 오디오 재사용
    const currentName = { value: null };  // rename 시 old_name으로 필요 (발음이 비슷해 오인식됐어도 성공으로 등록될 수 있음)

    recordBtn.onclick = () => recordAndEnroll(null, statusSpan, recordBtn, fallbackDiv, detectedTextSpan, lastPcm16, false, currentName, renameToggleBtn);
    manualConfirmBtn.onclick = () => recordAndEnroll(manualInput.value, statusSpan, recordBtn, fallbackDiv, detectedTextSpan, lastPcm16, true, currentName, renameToggleBtn);

    renameToggleBtn.onclick = () => {
      renameInput.value = currentName.value || "";
      renameBox.style.display = renameBox.style.display === "none" ? "flex" : "none";
    };
    renameConfirmBtn.onclick = async () => {
      const newName = renameInput.value.trim();
      if (!newName || !currentName.value) return;
      const sessionId = encodeURIComponent(sessionIdInput.value);
      const url = `${httpBase()}/api/enroll/${sessionId}/rename?old_name=${encodeURIComponent(currentName.value)}&new_name=${encodeURIComponent(newName)}`;
      const res = await fetch(url, { method: "PATCH" });
      const data = await res.json();
      if (data.status === "success") {
        currentName.value = data.speaker_name;
        statusSpan.textContent = `✅ "${data.speaker_name}" 등록됨 (수정됨)`;
        statusSpan.className = "enroll-status done";
        renameBox.style.display = "none";
        log(`✏️ 이름 수정 완료: ${data.speaker_name}`);
      } else {
        log(`❌ 이름 수정 실패: ${data.message}`);
      }
    };

    enrollRowsEl.appendChild(row);
  }
};

document.getElementById("clearEnrollBtn").onclick = async () => {
  await fetch(`${httpBase()}/api/enroll/${encodeURIComponent(sessionIdInput.value)}`, { method: "DELETE" });
  document.querySelectorAll(".enroll-status").forEach((el) => {
    el.textContent = "미등록";
    el.className = "enroll-status";
  });
  document.querySelectorAll(".enroll-fallback").forEach((el) => (el.style.display = "none"));
  document.querySelectorAll(".rename-toggle-btn").forEach((el) => (el.style.display = "none"));
  document.querySelectorAll(".rename-box").forEach((el) => (el.style.display = "none"));
  log("화자 등록 초기화됨");
};

// 말이 시작되고 나서 일정 시간 조용해지면 자동으로 녹음을 멈추는 간단한 클라이언트 측 침묵 감지
function recordUntilSilence() {
  return new Promise(async (resolve, reject) => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];

    let hasSpokenYet = false;
    let silentSinceMs = 0;
    let elapsedMs = 0;
    let finished = false;

    const finish = async () => {
      if (finished) return;  // onaudioprocess가 disconnect 직전에 한 번 더 발화할 수 있어 중복 방지
      finished = true;
      processor.disconnect();
      source.disconnect();
      stream.getTracks().forEach((t) => t.stop());
      await ctx.close();

      const totalLength = chunks.reduce((sum, c) => sum + c.length, 0);
      const merged = new Float32Array(totalLength);
      let offset = 0;
      for (const c of chunks) { merged.set(c, offset); offset += c.length; }
      resolve(merged);
    };

    processor.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const downsampled = downsampleTo16k(input, ctx.sampleRate);
      chunks.push(new Float32Array(downsampled));

      // RMS(음량 크기) 계산해서 "말하는 중"인지 "조용한지" 판단
      let sumSquares = 0;
      for (let i = 0; i < input.length; i++) sumSquares += input[i] * input[i];
      const rms = Math.sqrt(sumSquares / input.length);
      const chunkMs = (input.length / ctx.sampleRate) * 1000;
      elapsedMs += chunkMs;

      if (rms >= ENROLL_SPEECH_RMS) {
        hasSpokenYet = true;
        silentSinceMs = 0;
      } else if (hasSpokenYet) {
        silentSinceMs += chunkMs;
      }

      if ((hasSpokenYet && silentSinceMs >= ENROLL_SILENCE_MS) || elapsedMs >= ENROLL_MAX_SEC * 1000) {
        finish();
      }
    };

    source.connect(processor);
    processor.connect(ctx.destination);
  });
}

async function recordAndEnroll(manualName, statusSpan, recordBtn, fallbackDiv, detectedTextSpan, lastPcm16, isManualRetry = false, currentName = { value: null }, renameToggleBtn = null) {
  recordBtn.disabled = true;
  fallbackDiv.style.display = "none";
  statusSpan.textContent = isManualRetry ? "업로드 중..." : "🔴 듣는 중... (말하면 자동으로 인식돼요)";

  if (!isManualRetry) {
    const merged = await recordUntilSilence();
    lastPcm16.value = float32ToPCM16LE(merged);
    statusSpan.textContent = "인식 중...";
  }
  // 수동 재시도(isManualRetry=true)는 재녹음 없이, 직전에 녹음해둔 오디오를 그대로 재사용
  const pcm16 = lastPcm16.value;

  const sessionId = encodeURIComponent(sessionIdInput.value);
  const nameParam = manualName ? `?speaker_name=${encodeURIComponent(manualName)}` : "";
  const url = `${httpBase()}/api/enroll/${sessionId}${nameParam}`;

  const res = await fetch(url, {
    method: "POST",
    body: pcm16,
    headers: { "Content-Type": "application/octet-stream" },
  });
  const data = await res.json();

  if (data.status === "success") {
    statusSpan.textContent = `✅ "${data.speaker_name}" 등록됨 (인식된 말: "${data.detected_text}", 총 ${data.registered_count}명)`;
    statusSpan.className = "enroll-status done";
    currentName.value = data.speaker_name;
    // 이름은 뽑혔지만 발음이 비슷해 틀리게 인식됐을 수 있어 (예: "이준오"→"이준호"),
    // 등록 성공 여부와 무관하게 항상 수정 가능하게 노출
    if (renameToggleBtn) renameToggleBtn.style.display = "inline-block";
    log(`📇 화자 등록 성공: ${data.speaker_name}`);
  } else {
    // 이름 자동 인식 실패 → 수동 입력 폴백 UI 표시
    statusSpan.textContent = "❌ 이름 인식 실패";
    detectedTextSpan.textContent = data.detected_text || "(인식 안 됨)";
    fallbackDiv.style.display = "flex";
    log(`⚠️ 이름 자동 인식 실패: "${data.detected_text}"`);
  }
  recordBtn.disabled = false;
}

// ── ② 실시간 전사 ──────────────────────────────────────
function renderPartial(data) {
  if (!tentativeSpan) {
    tentativeSpan = document.createElement("span");
    tentativeSpan.className = "tentative";
    transcriptEl.appendChild(tentativeSpan);
  }
  tentativeSpan.textContent = " " + data.confirmed_text + " " + data.tentative_text + "...";
}

function renderFinal(data) {
  if (tentativeSpan) {
    tentativeSpan.remove();
    tentativeSpan = null;
  }
  const segments = data.final.segments;
  segments.forEach((seg) => {
    if (data.speaker) {
      const tag = document.createElement("span");
      tag.className = "speaker-tag";
      tag.textContent = data.speaker;
      transcriptEl.appendChild(tag);
    }
    const span = document.createElement("span");
    span.className = "final" + (seg.confident ? "" : " low-conf");
    span.textContent = seg.text + " ";
    span.title = `avg_logprob=${seg.avg_logprob.toFixed(2)}, no_speech_prob=${seg.no_speech_prob.toFixed(2)}`;
    transcriptEl.appendChild(span);
  });
  transcriptEl.appendChild(document.createElement("br"));
  log(`✅ final 청크 수신 (offset=${data.chunk_offset_sec}s, latency=${data.latency_sec}s, speaker=${data.speaker})`);
}

async function start() {
  ws = new WebSocket(wsUrl());
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { setStatus(true); log("WebSocket 연결됨"); };
  ws.onclose = () => { setStatus(false); log("WebSocket 연결 종료"); };
  ws.onerror = (e) => { log("WebSocket 에러: " + JSON.stringify(e)); };
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "partial") renderPartial(data);
    else if (data.type === "final") renderFinal(data);
    else if (data.type === "session_end") {
      log("✅ 서버가 잔여 버퍼 처리 완료 — 세션 정상 종료");
      ws.close();
    }
  };

  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioContext = new AudioContext();
  sourceNode = audioContext.createMediaStreamSource(mediaStream);

  // ScriptProcessorNode는 deprecated지만, 별도 빌드 과정 없이 빠르게 검증하기엔 충분함
  processorNode = audioContext.createScriptProcessor(4096, 1, 1);
  processorNode.onaudioprocess = (e) => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const downsampled = downsampleTo16k(input, audioContext.sampleRate);
    const pcm16 = float32ToPCM16LE(downsampled);
    ws.send(pcm16);
  };

  sourceNode.connect(processorNode);
  processorNode.connect(audioContext.destination);

  startBtn.disabled = true;
  stopBtn.disabled = false;
  log(`녹음 시작 (브라우저 샘플레이트: ${audioContext.sampleRate}Hz → 16kHz로 다운샘플링)`);
}

function stop() {
  if (processorNode) processorNode.disconnect();
  if (sourceNode) sourceNode.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
  if (audioContext) audioContext.close();

  // 바로 끊지 않고 "end"를 보내서 서버가 잔여 버퍼(마지막 발언)를 처리하게 함.
  // 서버가 session_end로 응답하면 onmessage에서 소켓을 닫는다.
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send("end");
    log("녹음 종료 — 서버의 잔여 버퍼 처리 대기 중...");
  } else if (ws) {
    ws.close();
  }

  startBtn.disabled = false;
  stopBtn.disabled = true;
}

startBtn.onclick = () => start().catch((e) => log("시작 실패: " + e.message));
stopBtn.onclick = stop;
</script>
</body>
</html>
